[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	h2zero/NimBLE-Arduino @ ^2.5.2
	contrem/arduino-timer @ ^3.0.1
	esp32async/AsyncTCP @ ^3.6.1
	bolderflight/Bolder Flight Systems ULEB128 @ ^2.1.2
	prampec/IotWebConf @ ^3.2.1
build_flags =
	-DSERIAL_DEBUG_BAUDRATE=${env:esp32dev.monitor_speed}
	-DCORE_DEBUG_LEVEL=3
	-DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
	-DMYNEWT_VAL_BLE_MESH=0
board_build.embed_files =
	src-web/index.html
	src-web/settings.html
	src-web/favicon.ico
	src-web/style.css
; NimBLE 2.x needs more app space than the 1.25 MB default partition.
board_build.partitions = min_spiffs.csv
test_ignore = test_calculations

